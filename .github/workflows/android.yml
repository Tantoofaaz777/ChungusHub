name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and validate
        working-directory: android
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Chungus-Android-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
